name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t a-discord-bot:ci .

      - name: Smoke test imports and ffmpeg
        run: docker run --rm a-discord-bot:ci sh -c "ffmpeg -version > /dev/null && python -c 'import davey, nacl, radio.RadioCog, radio.EventsCog'"
